name: Setup
description: Set up Node.js from .nvmrc and install the dependencies of an app

inputs:
  app:
    description: App directory (server or client)
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: ${{ inputs.app }}/package-lock.json

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: ${{ inputs.app }}
